<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    background: transparent;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
  }
  #container {
    background: #1e1e2e;
    border-radius: 12px;
    border: 1px solid #313244;
    padding: 8px;
    height: 100vh;
  }
  .item {
    padding: 10px 14px;
    color: #cdd6f4;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.1s;
  }
  .item.selected {
    background: #89b4fa;
    color: #1e1e2e;
    font-weight: 600;
  }
</style>
</head>
<body>
<div id="container">
  <div id="list"></div>
</div>

<script>
  const items = ["Close All Windows", "Open Terminal", "Lock PC", "Sleep"];
  let selected = 0;

  function render() {
    const list = document.getElementById('list');
    list.innerHTML = '';
    items.forEach((item, i) => {
      const div = document.createElement('div');
      div.className = 'item' + (i === selected ? ' selected' : '');
      div.textContent = item;
      div.onclick = () => { selected = i; execute(); };
      list.appendChild(div);
    });
  }

  function execute() {
    window.chrome.webview.postMessage(items[selected]);
  }

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { selected = (selected + 1) % items.length; render(); }
    else if (e.key === 'ArrowUp') { selected = (selected - 1 + items.length) % items.length; render(); }
    else if (e.key === 'Enter') { execute(); }
    else if (e.key === 'Escape') { window.chrome.webview.postMessage('__CANCEL__'); }
  });

  render();
</script>
</body>
</html>
